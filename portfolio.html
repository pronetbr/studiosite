<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Estúdio de Animação e Cinema</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="index.html">Estúdio Criativo</a>
        </div>
        <button class="nav-toggle" aria-label="toggle navigation">
            <span class="hamburger"></span>
        </button>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="index.html" class="nav__link">Home</a></li>
                <li class="nav__item"><a href="portfolio.html" class="nav__link">Portfólio</a></li>
                <li class="nav__item"><a href="about.html" class="nav__link">Sobre Nós</a></li>
                <li class="nav__item"><a href="services.html" class="nav__link">Serviços</a></li>
                <li class="nav__item"><a href="contact.html" class="nav__link">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Portfólio</h1>
        <section id="portfolio-filters">
            <button data-filter="all">Todos</button>
            <button data-filter="animation">Animação</button>
            <button data-filter="film">Filmes</button>
        </section>
        <section id="portfolio-grid">
            <article class="project-item">
                <img src="assets/images/placeholder-project-thumb1.jpg" alt="Thumbnail do Projeto A" loading="lazy">
                <h4>Projeto A</h4>
                <p>Curta descrição do Projeto A.</p>
            </article>
            <article class="project-item">
                <img src="assets/images/placeholder-project-thumb2.jpg" alt="Thumbnail do Projeto B" loading="lazy">
                <h4>Projeto B</h4>
                <p>Curta descrição do Projeto B.</p>
            </article>
            <article class="project-item">
                <img src="assets/images/placeholder-project-thumb3.jpg" alt="Thumbnail do Projeto C" loading="lazy">
                <h4>Projeto C</h4>
                <p>Curta descrição do Projeto C.</p>
            </article>
            <article class="project-item">
                <img src="assets/images/placeholder-project-thumb4.jpg" alt="Thumbnail do Projeto D" loading="lazy">
                <h4>Projeto D</h4>
                <p>Curta descrição do Projeto D.</p>
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Nome do Estúdio</p>
    </footer>
    <script src="js/script.js"></script>
    <div id="lightbox-modal" class="lightbox-modal" style="display: none;">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-image">
        <div id="lightbox-caption"></div>
    </div>
</body>
</html>
